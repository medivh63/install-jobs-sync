name = "install-jobs-sync"
main = "src/index.js"
compatibility_date = "2026-07-30"

# cron:每 30 分钟一次。要更低频就改这里(如每 2 小时 "0 */2 * * *")
[triggers]
crons = ["*/3 * * * *"]

# D1:填你创建时的库名和 id(忘了就跑 `wrangler d1 list` 查)
[[d1_databases]]
binding = "DB"
database_name = "solar_crew"
database_id   = "0bd35778-04f5-4001-adbb-6341f4fdfb66"

[vars]
FF_CREW_ID  = "15"              # Firefly 的 installer_crew_id
SCH_ORG_ID  = "4973"           # SubcontractorHub 路径里的组织 id
WINDOW_DAYS = "30"             # 统一"未来窗口"天数;B 家 API 必须给日期区间,A 家用它客户端筛
SCH_TZ      = "America/Edmonton"  # B 家 slot 是 UTC,按这个时区折算安装日(阿省=Mountain Time)
SCH_DETAIL_TTL_H = "24"         # B 家 project 详情缓存时长(小时);详情给结构化姓名/电话/邮箱/地址/板数/瓦数
FF_DETAIL_TTL_H  = "24"         # A 家 job 详情缓存时长(小时);详情给电话/邮箱/组件瓦数。缺省沿用上面那个

# 敏感值走 secret,别写在这里:
#   wrangler secret put FF_SESSION   # Firefly ff_session cookie(⚠️会过期,需定期更新)
#   wrangler secret put SCH_TOKEN    # SubcontractorHub Bearer token(长效)
#   wrangler secret put SCH_SID      # (可选)x-sid,实测不填也能通过;设了才发
#   wrangler secret put WEBHOOK_URL  # (可选)变化/告警通知 webhook
#   wrangler secret put READ_TOKEN   # ⚠️必需:/jobs 和 /run 的 Bearer 口令。
#     没设的话两个接口一律 503(fail closed)。/jobs 会返回客户姓名/电话/邮箱/
#     精确地址,/run 会打供应商接口耗配额,都不能裸奔。solarcrew 的
#     INSTALL_JOBS_TOKEN 必须与此一致。
